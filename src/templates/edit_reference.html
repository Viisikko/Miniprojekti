<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Reference</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='compiled.css') }}">
</head>

<body>

    <div class="main-container">
        <div class="mb-8">
            <h1>Edit Reference</h1>
            <p class="text-slate-600">Update the details for this reference.</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <form action="/update_reference" method="POST" class="space-y-4">
                <input type="hidden" name="id" value="{{ ref.id }}">
                <input type="hidden" name="type" value="{{ ref.type }}">

                <div>
                    <span class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Type</span>
                    <span class="ml-2 inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                        {{ ref.type }}
                    </span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Citation Key (Index)</label>
                    <input type="text" name="index" value="{{ ref.index }}" required
                        class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
                    <input type="text" name="title" value="{{ ref.title }}" required
                        class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Author (comma separated)</label>
                    <input type="text" name="author" value="{{ ref.author }}" required
                        class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Year</label>
                    <input type="number" name="year" value="{{ ref.year }}" required
                        class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Publisher</label>
                        <input type="text" name="publisher" value="{{ ref.publisher or '' }}"
                            class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Journal</label>
                        <input type="text" name="journal" value="{{ ref.journal or '' }}"
                            class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Booktitle</label>
                        <input type="text" name="booktitle" value="{{ ref.booktitle or '' }}"
                            class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Organization</label>
                        <input type="text" name="organization" value="{{ ref.organization or '' }}"
                            class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ISBN</label>
                        <input type="text" name="isbn" value="{{ ref.isbn or '' }}"
                            class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">DOI</label>
                        <input type="text" name="doi" value="{{ ref.doi or '' }}"
                            class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">URL</label>
                    <input type="text" name="url" value="{{ ref.url or '' }}"
                        class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>

                <div class="flex items-center justify-end space-x-4 pt-4 border-t border-slate-100 mt-6">
                    <a href="/" class="text-sm font-medium text-slate-600 hover:text-slate-900">Cancel</a>
                    <button type="submit" class="primary-button">
                        Update Reference
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
